<script>
document.documentElement.dataset.boot = 'loading';
</script>
<style>
.boot-loader {
  display: none;
}

html[data-boot] .boot-loader {
  --boot-background: #fdfcfa;
  --boot-well: #ebe7e1;
  --boot-mark: #b8afa6;

  display: block;
}

html[data-theme="dark"] .boot-loader {
  --boot-background: color-mix(in srgb, #232020 97%, #431c53);
  --boot-well: #332927;
  --boot-mark: #665c5a;
}

@media (prefers-color-scheme: dark) {
  html[data-theme="system"] .boot-loader {
    --boot-background: color-mix(in srgb, #232020 97%, #431c53);
    --boot-well: #332927;
    --boot-mark: #665c5a;
  }
}

.boot-loader-splash {
  position: fixed;
  top: 0;
  inset-inline-start: 0;
  z-index: 2147483647;
  width: 100vw;
  height: 100vh;
  height: 100dvh;

  display: flex;
  align-items: center;
  justify-content: center;

  background: var(--boot-background);
  transition: opacity 400ms ease;
}

.boot-loader-emblem {
  animation:
    boot-loader-appear 300ms ease 250ms backwards,
    boot-loader-float 2.6s ease-in-out 550ms infinite;
}

.boot-loader-logo {
  display: block;
  width: 88px;
  height: 88px;
}

.boot-loader-well {
  fill: var(--boot-well);
}

.boot-loader-level {
  transform: translateY(48px);
  transition: transform 300ms ease-out;
}

.boot-loader-wave {
  animation: boot-loader-wave 1.6s linear infinite;
}

.boot-loader-mark {
  stroke: var(--boot-mark);
}

.boot-loader-mark-lit {
  stroke: #fefefe;
  opacity: 0;
  transition: opacity 300ms ease-out;
}

.boot-loader-bar {
  position: fixed;
  inset-inline: 0;
  top: 0;
  z-index: 2147483647;
  height: 3px;

  background: linear-gradient(90deg, #e02760, #9f42c6);
  box-shadow: 0 0 10px #9f42c6;
  clip-path: inset(0 calc(100% - var(--boot-progress, 0%)) 0 0);
  pointer-events: none;
  animation: boot-loader-appear 200ms ease 250ms backwards;
  transition: clip-path 250ms ease-out, opacity 400ms ease;
}

html[dir="rtl"] .boot-loader-bar {
  background: linear-gradient(270deg, #e02760, #9f42c6);
  clip-path: inset(0 0 0 calc(100% - var(--boot-progress, 0%)));
}

html[data-boot="styled"] .boot-loader-splash {
  opacity: 0;
  pointer-events: none;
}

.boot-loader.is-complete .boot-loader-bar {
  opacity: 0;
}

@keyframes boot-loader-appear {
  from {
    opacity: 0;
  }

  to {
    opacity: 1;
  }
}

@keyframes boot-loader-float {
  0%,
  100% {
    transform: translateY(0);
  }

  50% {
    transform: translateY(-8px);
  }
}

@keyframes boot-loader-wave {
  to {
    transform: translateX(-24px);
  }
}

@media (prefers-reduced-motion: reduce) {
  .boot-loader-emblem {
    animation: boot-loader-appear 300ms ease 250ms backwards;
  }

  .boot-loader-wave {
    animation: none;
  }
}
</style>
<div
  class="boot-loader"
  role="progressbar"
  aria-label="Trakt Time"
  aria-valuemin="0"
  aria-valuemax="100"
  aria-valuenow="0"
  data-css="%boot.css%"
  data-js="%boot.js%"
>
  <div class="boot-loader-splash">
    <div class="boot-loader-emblem">
      <svg class="boot-loader-logo" viewBox="0 0 48 48" aria-hidden="true">
        <defs>
          <linearGradient
            id="boot-loader-gradient"
            x1="0"
            y1="48"
            x2="48"
            y2="0"
            gradientUnits="userSpaceOnUse"
          >
            <stop offset="0%" stop-color="#e02760" />
            <stop offset="100%" stop-color="#9f42c6" />
          </linearGradient>
          <clipPath id="boot-loader-tile">
            <rect width="48" height="48" rx="11" />
          </clipPath>
          <g id="boot-loader-strokes" stroke-width="2.4" stroke-linecap="round">
            <line x1="11" y1="14" x2="37" y2="14" />
            <line x1="11" y1="18" x2="37" y2="18" />
            <line x1="11" y1="22" x2="37" y2="22" />
            <line x1="20" y1="23" x2="20" y2="40" />
            <line x1="24" y1="23" x2="24" y2="40" />
            <line x1="28" y1="23" x2="28" y2="40" />
          </g>
        </defs>
        <rect class="boot-loader-well" width="48" height="48" rx="11" />
        <g clip-path="url(#boot-loader-tile)">
          <g class="boot-loader-level">
            <rect
              x="0"
              y="2"
              width="48"
              height="60"
              fill="url(#boot-loader-gradient)"
            />
            <path
              class="boot-loader-wave"
              d="M0 3 Q6 0 12 3 T24 3 T36 3 T48 3 T60 3 T72 3 V6 H0 Z"
              fill="url(#boot-loader-gradient)"
            />
          </g>
          <use class="boot-loader-mark" href="#boot-loader-strokes" />
          <use class="boot-loader-mark-lit" href="#boot-loader-strokes" />
        </g>
      </svg>
    </div>
  </div>
  <div class="boot-loader-bar"></div>
</div>
<script>
(() => {
  const STYLES_SHARE = 0.4;
  const LEVEL_EMPTY = 48;
  const LEVEL_FULL = -4;
  const STYLES_TIMEOUT_MS = 20000;
  const SPLASH_DELAY_MS = 250;
  const CROSSFADE_MS = 400;
  const BAR_FADE_MS = 700;
  const APP_SCRIPT = /\/_app\/immutable\/.+\.js$/;

  const html = document.documentElement;
  const loader = document.querySelector('.boot-loader');
  const splash = loader.querySelector('.boot-loader-splash');
  const level = loader.querySelector('.boot-loader-level');
  const markLit = loader.querySelector('.boot-loader-mark-lit');

  const stylesTotal = Number(loader.dataset.css) || 1;
  const scriptsTotal = Number(loader.dataset.js) || 1;
  const scripts = new Set();
  const startedAt = performance.now();

  const observer = typeof PerformanceObserver === 'function'
    ? new PerformanceObserver((list) => {
      list.getEntries()
        .filter((entry) => APP_SCRIPT.test(entry.name))
        .forEach((entry) => scripts.add(entry.name));
    })
    : null;
  observer?.observe({ type: 'resource', buffered: true });

  const isStylesheetSettled = (link) =>
    link.sheet !== null || link.dataset.bootFailed !== undefined;

  const isAppReady = () => html.hasAttribute('data-app-ready');

  const reveal = () => {
    html.dataset.boot = 'styled';

    if (performance.now() - startedAt < SPLASH_DELAY_MS) {
      loader.remove();
      return;
    }

    setTimeout(() => splash.remove(), CROSSFADE_MS);
  };

  const complete = () => {
    loader.classList.add('is-complete');
    loader.style.setProperty('--boot-progress', '100%');
    observer?.disconnect();
    setTimeout(() => {
      loader.remove();
      delete html.dataset.boot;
    }, BAR_FADE_MS);
  };

  const tick = () => {
    const stylesDone = Array.from(
      document.querySelectorAll('link[data-boot-css]'),
    ).filter(isStylesheetSettled).length;
    const stylesProgress = Math.min(stylesDone / stylesTotal, 1);
    const scriptsProgress = Math.min(scripts.size / scriptsTotal, 1);
    const progress = STYLES_SHARE * stylesProgress +
      (1 - STYLES_SHARE) * 0.95 * scriptsProgress;
    const value = Math.floor(progress * 100);

    level.style.transform = `translateY(${
      LEVEL_EMPTY - (LEVEL_EMPTY - LEVEL_FULL) * stylesProgress
    }px)`;
    markLit.style.opacity = String(Math.max(0, (stylesProgress - 0.5) * 2));
    loader.setAttribute('aria-valuenow', String(value));
    loader.style.setProperty('--boot-progress', `${value}%`);

    const stylesTimedOut = performance.now() - startedAt > STYLES_TIMEOUT_MS;
    if (
      html.dataset.boot === 'loading' &&
      (stylesProgress === 1 || stylesTimedOut)
    ) {
      reveal();
    }

    if (!loader.isConnected) {
      observer?.disconnect();
      delete html.dataset.boot;
      return;
    }

    if (html.dataset.boot === 'styled' && isAppReady()) {
      complete();
      return;
    }

    requestAnimationFrame(tick);
  };

  tick();
})();
</script>
